<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 412×915 = Pixel 7 逻辑尺寸（dp）。1dp 当 1px 用，量出来的高度就是真机高度。 */
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222;display:flex;justify-content:center;padding:0}
  :root{
    --accent:#4F46E5; --accentSoft:#EEF0FE;
    --good:#0E9F6E; --warn:#B45309; --bad:#DC2626;
    --ink:#1B2030; --sub:#6B7280; --hair:rgba(27,32,48,.10);
    --glass:rgba(255,255,255,.58); --glassStrong:rgba(255,255,255,.88);
    --glassEdge:rgba(255,255,255,.85);
    --tabInk:#8A90A6;
  }
  .screen{
    position:relative;width:412px;height:915px;overflow:hidden;
    background:linear-gradient(180deg,#EEF2FF 0%,#F5F3FF 52%,#ECFEFF 100%);
    font-family:-apple-system,"Noto Sans CJK SC","PingFang SC",sans-serif;
    color:var(--ink);
  }
  /* 四色光斑，同 AuroraBackground */
  .orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;pointer-events:none}
  .o1{width:520px;height:520px;left:-120px;top:-180px;background:radial-gradient(circle,#7C3AED 0%,transparent 70%)}
  .o2{width:440px;height:440px;right:-150px;top:140px;background:radial-gradient(circle,#EC4899 0%,transparent 70%);opacity:.5}
  .o3{width:480px;height:480px;left:-140px;bottom:60px;background:radial-gradient(circle,#3B82F6 0%,transparent 70%);opacity:.47}
  .o4{width:400px;height:400px;right:-120px;bottom:-120px;background:radial-gradient(circle,#F59E0B 0%,transparent 70%);opacity:.38}

  /* 状态栏：真实高度 24dp，图标在左时间，右侧状态图标 */
  .statusbar{
    position:relative;height:24px;display:flex;align-items:center;
    padding:0 16px;font-size:13px;font-weight:600;letter-spacing:.2px;
  }
  .sb-right{margin-left:auto;display:flex;align-items:center;gap:5px}
  .sig{display:flex;align-items:flex-end;gap:1.5px;height:10px}
  .sig i{width:2.5px;background:var(--ink);border-radius:1px;display:block}
  .sig i:nth-child(1){height:3px}.sig i:nth-child(2){height:5px}
  .sig i:nth-child(3){height:7px}.sig i:nth-child(4){height:9px}
  .wifi{width:13px;height:9px;border:1.6px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0;opacity:.9}
  .bat{width:20px;height:10px;border:1.4px solid var(--ink);border-radius:3px;position:relative}
  .bat:after{content:"";position:absolute;right:-3px;top:3px;width:1.6px;height:4px;background:var(--ink);border-radius:0 1px 1px 0}
  .bat i{position:absolute;inset:1.6px;width:70%;background:var(--ink);border-radius:1px}

  .content{position:relative;padding:0 14px}

  /* 粘贴框：72dp，约两行半。框大了只会显空——粘贴不需要那么大的地 */
  .paste{
    margin-top:12px;height:72px;
    background:var(--glass);border:1px solid var(--glassEdge);border-radius:14px;
    padding:11px 12px;
    box-shadow:0 6px 18px rgba(27,32,48,.08);
    backdrop-filter:blur(18px);
  }
  .ph{font-size:15px;color:var(--sub)}

  /* 两个动作都做成按钮形态，左右各一，避免一个词飘在左边一大片空里 */
  .acts{display:flex;align-items:center;gap:8px;margin-top:10px}
  .btn-ghost{
    font-size:15px;font-weight:500;color:var(--ink);
    padding:9px 16px;border-radius:12px;
    border:1px solid rgba(27,32,48,.16);
    background:rgba(255,255,255,.42);
  }
  .btn{
    margin-left:auto;background:var(--accent);color:#fff;
    font-size:15px;font-weight:600;padding:9px 18px;border-radius:12px;
    box-shadow:0 4px 12px rgba(79,70,229,.28);
  }
  .btn.off{background:rgba(27,32,48,.07);color:var(--sub);box-shadow:none}

  /* 书单：一张玻璃卡包住，inset grouped */
  .card{
    margin-top:20px;background:var(--glass);border:1px solid var(--glassEdge);
    border-radius:20px;padding:14px;backdrop-filter:blur(18px);
    box-shadow:0 8px 24px rgba(27,32,48,.09);
  }
  .row{display:flex;align-items:flex-start}
  .left{flex:1;min-width:0}
  .t{font-size:17px;font-weight:500}
  .m{font-size:13px;color:var(--sub);margin-top:3px}
  .bar{height:5px;border-radius:3px;background:var(--hair);margin-top:7px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .chip{
    margin-left:8px;background:rgba(180,83,9,.14);color:var(--warn);
    font-size:11px;padding:2px 7px;border-radius:8px;white-space:nowrap;
  }

  /* 底部四空间：底色铺到手势条底下，字避让 */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;
    background:var(--glassStrong);backdrop-filter:blur(20px);
    border-top:1px solid rgba(27,32,48,.06);
  }
  .tabs{display:flex;justify-content:space-evenly;padding:8px 0}
  .tabs span{font-size:13px;color:var(--tabInk);padding:6px 14px;border-radius:12px}
  .tabs span.on{color:var(--accent);font-weight:600}
  /* 手势条：真实 12dp 高，系统画的，不算 app 的内容 */
  .gesture{height:16px;display:flex;align-items:center;justify-content:center}
  .gesture i{width:108px;height:4px;border-radius:2px;background:rgba(27,32,48,.28)}

  .note{position:absolute;left:0;right:0;top:0;display:none}
</style>
</head>
<body>
<div class="screen">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>

  <div class="statusbar">
    <span>9:41</span>
    <div class="sb-right">
      <div class="sig"><i></i><i></i><i></i><i></i></div>
      <div class="wifi"></div>
      <div class="bat"><i></i></div>
    </div>
  </div>

  <div class="content">
    <div class="paste"><div class="ph">在这里粘贴…</div></div>

    <div class="acts">
      <span class="btn-ghost">导入文件</span>
      <span class="btn off">合成</span>
    </div>

    <div class="card">
      <div class="row">
        <div class="left">
          <div class="t">活着</div>
          <div class="m">6 章 · 听完 4 章</div>
          <div class="bar"><i style="width:66%"></i></div>
        </div>
        <div class="chip">制作中</div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tabs">
      <span class="on">我的书</span><span>这一本</span><span>正在做</span><span>正在听</span>
    </div>
    <div class="gesture"><i></i></div>
  </div>
</div>
</body>
</html>
