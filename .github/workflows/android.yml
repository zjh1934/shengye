name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它在本 runner 上会直接失败。
      # ubuntu-latest 预装了 SDK，缺 cmdline-tools 就自己补。
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK 路径: $SDK"
          ls "$SDK" || true
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "补 cmdline-tools"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdt
            mv /tmp/cmdt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install SDK platforms
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -5

      # 冷启动一次要下 Gradle 发行包 + 全套 AGP/Kotlin/Compose 依赖，六七分钟；
      # 缓存后通常 2 分钟内跑完，验收节奏才跟得上。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/notifications
            /opt/gradle-8.9
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Gradle
        run: |
          if [ ! -x /opt/gradle-8.9/bin/gradle ]; then
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q /tmp/gradle.zip -d /opt
          fi
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version | head -6

      # 纯逻辑单测先跑：状态机错了，界面再漂亮也是错的
      - name: Unit tests (core:domain)
        working-directory: android
        run: gradle :core:domain:test --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/shengye-${SHORT_SHA}.apk"
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shengye-debug-apk
          path: out/*.apk
          retention-days: 30

      # 打 tag（v*）时自动发 Release，用户从 Release 页下载安装
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
